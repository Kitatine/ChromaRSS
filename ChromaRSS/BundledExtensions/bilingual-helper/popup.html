<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 15px -apple-system, sans-serif; margin: 0; padding: 16px; min-width: 260px; }
    h1 { font-size: 17px; margin: 0 0 12px; }
    label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    button { width: 100%; padding: 10px; font-size: 15px; border-radius: 10px; border: none; background: #0a84ff; color: #fff; }
    p.tip { color: #666; font-size: 13px; line-height: 1.4; }
    #status { margin: 8px 0; color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Bilingual Helper</h1>
  <label><span>Show floating 文A button</span><input type="checkbox" id="pill"></label>
  <button id="toggle">Toggle bilingual preview on this article</button>
  <div id="status"></div>
  <p class="tip">Tip: install the full <b>Immersive Translate</b> extension from the Extensions tab for whole-page bilingual translation.</p>
  <script src="popup.js"></script>
</body>
</html>
